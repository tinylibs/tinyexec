name: CI Build

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    name: Lint and Build on Node.js (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: latest
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run build:types
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build
          if-no-files-found: error
          retention-days: 1
          path: |
            dist
            lib
            node_modules

  test:
    name: Test on Node.js ${{ matrix.node.version }} @ ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        node:
          - version: '18.x' # LTS "Hydrogen"
          - version: '20.x' # LTS "Iron"
          - version: '22.x' # LTS "Jod"
            NODE_OPTIONS: '--no-experimental-strip-types' # ignore source TS files
          - version: '24.x' # LTS "Krypton"
            NODE_OPTIONS: '--no-strip-types' # ignore source TS files
          - version: 'latest'
            NODE_OPTIONS: '--no-strip-types' # ignore source TS files
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js ${{ matrix.node.version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node.version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
      - run: node --test
        env:
          NODE_OPTIONS: ${{ matrix.node.NODE_OPTIONS }}

  bun-build-test:
    name: Build on Bun (latest) @ ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: bun --bun run build
      - run: bun test
